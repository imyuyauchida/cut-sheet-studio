<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f4">
<title>カットシート・スタジオ</title>
<meta name="description" content="動画からカットを抽出し、音声メモ付きのA4カットシートを作成できます。">
<style>
:root{color-scheme:light;--bg:#f7f8f4;--white:#fff;--ink:#19241e;--muted:#56645b;--line:#dce2da;--green:#175641;--pale:#eaf3ec;--dark:#18251e;--lime:#d9ed9d;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,select:disabled{opacity:.48;cursor:default}
:focus-visible{outline:3px solid #54a280;outline-offset:3px}
[hidden]{display:none!important}
svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
header{background:var(--white);border-bottom:1px solid var(--line)}
.top,.wrap{width:min(1256px,calc(100% - 64px));margin:auto}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:750}
.logo{display:grid;place-items:center;width:36px;height:36px;background:var(--dark);color:var(--lime);border-radius:8px}
.badge,.eyebrow,.serial,.clock,.length,.tags{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{padding:4px 9px;background:var(--pale);color:var(--green);border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.05em}
.intro{padding:35px 0 25px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
.eyebrow{color:var(--green);font-size:11px;font-weight:750;letter-spacing:.15em;margin:0 0 9px;display:flex;align-items:center;gap:8px}
.eyebrow:before{content:"";background:#5b9368;width:7px;height:7px;border-radius:50%}
h1,h2,p{margin:0}
h1{font-size:clamp(29px,4vw,44px);font-weight:770;letter-spacing:-.055em;line-height:1.25}
.intro p:last-child{margin-top:10px;color:var(--muted)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:white;border-radius:7px;padding:8px 12px;font-weight:700;font-size:12px;min-height:37px;white-space:nowrap}
.button svg{width:16px;height:16px;flex:none}
.button:hover:not(:disabled){background:var(--pale);border-color:#a8c4b1}
.primary{color:#fff;background:var(--green);border-color:var(--green);padding:10px 16px}
.primary:hover:not(:disabled){color:white;background:#104331;border-color:#104331}
.primary:disabled{opacity:1;background:#e5ebe3;color:#57655b;border-color:#dce4da}
.workspace{display:grid;grid-template-columns:minmax(285px, .95fr) minmax(0,1.8fr);align-items:start;gap:19px}
.card{min-width:0;border:1px solid var(--line);background:var(--white);border-radius:11px;overflow:hidden}
.source{position:sticky;top:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;min-height:64px;border-bottom:1px solid var(--line)}
h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;white-space:nowrap}
h2 svg{width:17px;height:17px;color:var(--green)}
.stage{padding:12px;background:var(--dark);position:relative}
video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#101913}
.drop{width:100%;min-height:216px;border:1px dashed #637a68;color:#ecf0e6;background:#1e2e24;border-radius:6px;display:grid;place-items:center;padding:20px;text-align:center}
.drop:hover,.drop.over{border-color:var(--lime);background:#2a3c2d}
.drop-inner{display:grid;justify-items:center;gap:5px}
.upload-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:8px;background:#344837;color:var(--lime);margin-bottom:5px}
.drop strong{font-size:14px}
.drop small{color:#c0ccbe;font-size:11px}
.drop-action{color:var(--lime);font-weight:700;font-size:12px;margin-top:7px}
.sourcebody{padding:14px 16px 16px}
.filename{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.meta,.hint{color:var(--muted);font-size:11px;margin-top:3px}
.tools{display:grid;gap:9px;margin-top:12px}
.settings{display:flex;align-items:center;gap:8px}
.settings label{font-size:11px;color:var(--muted);flex:1}
select{border:1px solid var(--line);border-radius:6px;background:var(--white);padding:6px 8px;font-size:12px}
.progress{display:grid;gap:7px;padding:12px 16px;background:var(--pale);border-top:1px solid var(--line)}
.progress div{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
progress{accent-color:var(--green);width:100%;height:8px}
.sheet{min-height:390px}
.sheet-title{display:grid;gap:4px;padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.sheet-title label{font-size:12px;font-weight:700}
.sheet-title input{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--white);font-size:13px}
.sheet-title input::placeholder{color:var(--muted)}
.columns,.cut{display:grid;grid-template-columns:minmax(112px,1.15fr) minmax(82px,.65fr) minmax(122px,1.65fr) 28px;column-gap:12px}
.columns{background:#f0f3ee;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700}
.empty{display:grid;justify-items:center;align-content:center;text-align:center;min-height:275px;padding:24px;color:var(--muted)}
.empty-icon{display:grid;place-items:center;width:48px;height:48px;background:var(--pale);color:var(--green);border-radius:10px;margin-bottom:13px}
.empty-icon svg{width:23px;height:23px}
.empty strong{font-size:15px;color:var(--ink);margin-bottom:4px}
.empty p{font-size:12px;max-width:320px}
.cut{align-items:start;padding:13px 16px;border-bottom:1px solid var(--line)}
.cut:last-child{border-bottom:0}
.cut.active{background:#f5f9f4}
.preview{padding:0;text-align:left;border:0;background:none;min-width:0}
.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#162019;border-radius:5px}
.serial{display:block;font-size:10px;margin-top:4px;color:var(--green);font-weight:700}
.length{font-size:15px;font-weight:750}
.clock{color:var(--muted);font-size:10px;overflow-wrap:anywhere}
textarea{display:block;width:100%;min-width:0;min-height:77px;border:1px solid var(--line);background:white;border-radius:6px;padding:7px 8px;font-size:12px;resize:vertical}
textarea::placeholder{color:#617066}
.icon-button{border:0;border-radius:5px;background:transparent;color:var(--muted);padding:5px;min-width:28px;min-height:28px}
.icon-button svg{width:15px;height:15px}
.icon-button:hover:not(:disabled){color:#9c3434;background:#f8e9e8}
.alert{background:#f9ece7;color:#80382b;border:1px solid #f0d7d0;padding:9px 12px;border-radius:6px;margin-bottom:12px;font-size:12px}
footer{color:var(--muted);padding:17px 0 24px;font-size:11px;display:flex;gap:6px;align-items:center}
footer svg{height:13px;width:13px}
@media(max-width:900px){.workspace{grid-template-columns:minmax(230px,.75fr) minmax(0,1.45fr);gap:12px}.top,.wrap{width:calc(100% - 36px)}.columns,.cut{column-gap:7px;padding-left:10px;padding-right:10px}}
@media(max-width:740px){.workspace{grid-template-columns:1fr}.source{position:static}.intro{padding:24px 0 16px}.intro p:last-child{font-size:12px}.top{height:58px}.drop{min-height:168px}.sheet{min-height:305px}.empty{min-height:200px}}
@media(max-width:445px){.top,.wrap{width:calc(100% - 24px)}.intro{align-items:flex-start;flex-direction:column;gap:10px}.columns,.cut{grid-template-columns:minmax(68px,1fr) minmax(58px,.68fr) minmax(83px,1.15fr) 24px;column-gap:5px}.cut{padding-block:9px}.length{font-size:13px}.clock{font-size:9px}.cardhead{padding-inline:10px}.button{padding-inline:8px}}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0">
<symbol id="film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7.5 4v16m9-16v16M3 9h4.5m9 0H21M3 15h4.5m9 0H21"/></symbol>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
<symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
<symbol id="sheet" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h3m3 0h2m-8 5h3m3 0h2"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13m-8 4v5m4-5v5"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
</svg>
<header><div class="top"><div class="brand"><span class="logo"><svg aria-hidden="true"><use href="#film"/></svg></span>カットシート・スタジオ</div><span class="badge">A4 / PORTRAIT</span></div></header>
<main class="wrap">
<section class="intro"><div><p class="eyebrow">VIDEO WORKSPACE</p><h1>カットシートを作成</h1><p>映像のカットと音声メモを、1枚ずつ見返せる資料に。</p></div><button class="button primary" id="pdf" disabled><svg aria-hidden="true"><use href="#download"/></svg>PDFをダウンロード</button></section>
<p id="error" class="alert" role="alert" hidden></p>
<div class="workspace">
<section class="card source" id="source" aria-labelledby="source-heading">
<div class="cardhead"><h2 id="source-heading"><svg aria-hidden="true"><use href="#film"/></svg>ソース映像</h2><button type="button" class="button" id="replace" hidden>動画を変更</button></div>
<input type="file" id="file" accept="video/*,.mp4,.mov,.webm,.m4v" hidden>
<div class="stage"><button type="button" class="drop" id="pick"><span class="drop-inner"><span class="upload-icon"><svg aria-hidden="true"><use href="#upload"/></svg></span><strong>ここに動画をドロップ</strong><span class="drop-action">またはファイルを選択</span><small>MP4・MOV・WebM など</small></span></button><video id="video" controls playsinline preload="auto" hidden></video></div>
<div class="sourcebody">
<p class="filename" id="filename">動画を読み込んで開始</p><p class="meta" id="meta">読み込むと、カットの切り替わりを自動で検出します。</p>
<div class="tools" id="tools" hidden>
<button class="button" id="add" type="button"><svg aria-hidden="true"><use href="#plus"/></svg>再生位置にカットを追加</button>
<div class="settings"><label for="sensitivity">検出感度</label><select id="sensitivity"><option value=".32">低め</option><option value=".23" selected>標準</option><option value=".15">高め</option></select><button class="button" type="button" id="scan">再検出</button></div>
<p class="hint">再検出では現在のカットと音声メモを置き換えます。</p>
</div></div>
<div class="progress" id="progress-box" hidden><div><span id="status" role="status"></span><button type="button" class="button" id="cancel">中止</button></div><progress id="progress" aria-label="処理の進行状況" max="100"></progress></div>
</section>
<section class="card sheet" aria-labelledby="sheet-heading">
<div class="cardhead"><h2 id="sheet-heading"><svg aria-hidden="true"><use href="#sheet"/></svg>カット一覧</h2><span id="count" class="badge">0 CUTS</span></div>
<div class="sheet-title">
<label for="sheet-title">カットシートのタイトル</label>
<input id="sheet-title" type="text" maxlength="160" placeholder="空欄の場合は映像のファイル名を表示">
</div>
<div class="columns" aria-hidden="true"><span>キャプチャー</span><span>秒数・開始</span><span>音声メモ</span><span></span></div>
<div class="empty" id="empty"><span class="empty-icon"><svg aria-hidden="true"><use href="#sheet"/></svg></span><strong>カットがここに並びます</strong><p>動画を読み込んだら、各カットの右側にナレーションや歌詞などを書き込めます。</p></div>
<div id="cuts"></div>
</section>
</div>
<footer><svg aria-hidden="true"><use href="#lock"/></svg>動画と音声メモはブラウザ内で処理されます。</footer>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const video = byId('video');
const picker = byId('file');
const list = byId('cuts');
const state = { file: null, url: null, duration: 0, cuts: [], task: null };
const cutNo = index => String(index + 1).padStart(2, '0');
const seconds = value => value.toFixed(1) + ' 秒';
function clock(value) {
  const tenths = Math.round(value * 10);
  const h = Math.floor(tenths / 36000);
  const min = Math.floor(tenths / 600) % 60;
  const sec = Math.floor(tenths / 10) % 60;
  const pad = number => String(number).padStart(2, '0');
  return (h ? pad(h) + ':' : '') + pad(min) + ':' + pad(sec) + '.' + tenths % 10;
}
function error(message = '') {
  byId('error').textContent = message;
  byId('error').hidden = !message;
}
function refresh() {
  const busy = Boolean(state.task);
  const loaded = Boolean(state.file);
  for (const id of ['replace', 'tools', 'video']) byId(id).hidden = !loaded;
  byId('pick').hidden = loaded;
  for (const id of ['pick', 'replace', 'add', 'sensitivity', 'scan', 'sheet-title']) byId(id).disabled = busy;
  byId('pdf').disabled = busy || !state.cuts.length;
  byId('progress-box').hidden = !busy;
  byId('cancel').hidden = busy && !state.task.controller;
  byId('filename').textContent = state.file?.name ?? '動画を読み込んで開始';
  byId('meta').textContent = loaded
    ? '全体 ' + clock(state.duration)
    : '読み込むと、カットの切り替わりを自動で検出します。';
  byId('count').textContent = state.cuts.length + ' CUTS';
  byId('empty').hidden = Boolean(state.cuts.length);
  for (const button of list.querySelectorAll('.icon-button')) button.disabled = busy;
  for (const note of list.querySelectorAll('textarea')) note.readOnly = busy;
}
function markActive() {
  const index = state.cuts.findLastIndex(cut => cut.start <= video.currentTime + .015);
  for (const [i, row] of Array.from(list.children).entries()) row.classList.toggle('active', i === index);
}
function render() {
  list.replaceChildren();
  for (const [index, cut] of state.cuts.entries()) {
    const next = state.cuts[index + 1]?.start ?? state.duration;
    const row = document.createElement('article');
    row.className = 'cut';
    row.innerHTML = `
      <button type="button" class="preview"><img alt=""><span class="serial"></span></button>
      <div><div class="length"></div><div class="clock"></div></div>
      <textarea rows="3" placeholder="ナレーション、歌詞、BGM など"></textarea>
      <button type="button" class="icon-button"><svg aria-hidden="true"><use href="#trash"/></svg></button>`;
    const preview = row.querySelector('.preview');
    preview.setAttribute('aria-label', 'カット ' + cutNo(index) + ' の開始位置へ移動');
    preview.onclick = () => { video.currentTime = cut.start; };
    row.querySelector('img').src = cut.image;
    row.querySelector('.serial').textContent = 'CUT ' + cutNo(index);
    row.querySelector('.length').textContent = seconds(next - cut.start);
    row.querySelector('.clock').textContent = clock(cut.start);
    const note = row.querySelector('textarea');
    note.setAttribute('aria-label', 'カット ' + cutNo(index) + ' の音声メモ');
    note.value = cut.note;
    note.addEventListener('input', () => { cut.note = note.value; });
    const remove = row.querySelector('.icon-button');
    const label = index === 0 ? '先頭カットは固定' : 'カット ' + cutNo(index) + ' の境目を削除';
    remove.title = label;
    remove.setAttribute('aria-label', label);
    if (index === 0) {
      remove.hidden = true;
    } else {
      remove.onclick = () => {
        const prev = state.cuts[index - 1];
        if (cut.note.trim()) prev.note = [prev.note, cut.note].filter(Boolean).join('\n');
        state.cuts.splice(index, 1);
        render();
        list.children[index - 1]?.querySelector('.preview').focus();
      };
    }
    list.append(row);
  }
  refresh();
  markActive();
}
video.addEventListener('timeupdate', markActive);
video.addEventListener('seeked', markActive);
function progress(label, value) {
  byId('status').textContent = label;
  if (value == null) byId('progress').removeAttribute('value');
  else byId('progress').value = value;
}
async function run(label, job, failure, cancellable = true) {
  if (state.task) return;
  const controller = cancellable ? new AbortController() : null;
  state.task = { controller };
  byId('cancel').disabled = false;
  error();
  progress(label);
  refresh();
  try {
    await job(controller?.signal);
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      error(failure);
    }
  } finally {
    state.task = null;
    refresh();
  }
}
byId('cancel').onclick = () => {
  byId('cancel').disabled = true;
  state.task?.controller?.abort();
};
function mediaEvent(media, event, signal, action) {
  return new Promise((resolve, reject) => {
    signal.throwIfAborted();
    let timer;
    const clean = () => {
      clearTimeout(timer);
      media.removeEventListener(event, ready);
      media.removeEventListener('error', fail);
      signal.removeEventListener('abort', abort);
    };
    const ready = () => { clean(); resolve(); };
    const fail = () => { clean(); reject(new Error('Video decoding failed')); };
    const abort = () => { clean(); reject(signal.reason); };
    media.addEventListener(event, ready, { once: true });
    media.addEventListener('error', fail, { once: true });
    signal.addEventListener('abort', abort, { once: true });
    timer = setTimeout(fail, 15000);
    try { action(); } catch (err) { clean(); reject(err); }
  });
}
async function withReader(url, signal, use) {
  const reader = document.createElement('video');
  reader.preload = 'auto';
  reader.muted = true;
  try {
    await mediaEvent(reader, 'loadeddata', signal, () => { reader.src = url; });
    if (!reader.videoWidth || !Number.isFinite(reader.duration) || reader.duration <= 0) {
      throw new Error('No finite video track');
    }
    return await use(reader);
  } finally {
    reader.removeAttribute('src');
    reader.load();
  }
}
async function seek(reader, time, signal) {
  signal.throwIfAborted();
  if (Math.abs(reader.currentTime - time) < .0001 && reader.readyState >= 2) return;
  await mediaEvent(reader, 'seeked', signal, () => { reader.currentTime = time; });
}
function capture(reader, start) {
  const image = document.createElement('canvas');
  const scale = Math.min(1, 640 / Math.max(reader.videoWidth, reader.videoHeight));
  image.width = Math.max(1, Math.round(reader.videoWidth * scale));
  image.height = Math.max(1, Math.round(reader.videoHeight * scale));
  image.getContext('2d').drawImage(reader, 0, 0, image.width, image.height);
  return { start, image: image.toDataURL('image/jpeg', .86), note: '' };
}
function describe(reader, ctx) {
  ctx.drawImage(reader, 0, 0, 32, 18);
  const pixels = ctx.getImageData(0, 0, 32, 18).data;
  const histogram = new Uint16Array(64);
  for (let i = 0; i < pixels.length; i += 4) {
    histogram[(pixels[i] >> 6) * 16 + (pixels[i + 1] >> 6) * 4 + (pixels[i + 2] >> 6)]++;
  }
  return { pixels, histogram };
}
function difference(a, b) {
  let pixelDelta = 0;
  let colorDelta = 0;
  for (let i = 0; i < a.pixels.length; i += 4) {
    pixelDelta += Math.abs(a.pixels[i] - b.pixels[i])
      + Math.abs(a.pixels[i + 1] - b.pixels[i + 1])
      + Math.abs(a.pixels[i + 2] - b.pixels[i + 2]);
  }
  for (let i = 0; i < a.histogram.length; i++) colorDelta += Math.abs(a.histogram[i] - b.histogram[i]);
  return .8 * pixelDelta / (32 * 18 * 3 * 255) + .2 * colorDelta / (32 * 18 * 2);
}
// Project the frame onto a blend of the two endpoint frames. The residual
// rejects changes that don't resemble an overlay, such as a camera pan.
function blendPosition(frame, left, right) {
  let span = 0;
  let projection = 0;
  let distance = 0;
  for (let i = 0; i < left.pixels.length; i += 4) {
    for (let channel = i; channel < i + 3; channel++) {
      const delta = right.pixels[channel] - left.pixels[channel];
      const change = frame.pixels[channel] - left.pixels[channel];
      span += delta * delta;
      projection += delta * change;
      distance += change * change;
    }
  }
  if (!span) return { amount: 0, residual: Infinity };
  const amount = projection / span;
  return { amount, residual: Math.sqrt(Math.max(0, distance / span - amount * amount)) };
}
function findDissolve(samples, threshold) {
  // One look-ahead sample helps distinguish the final shot from another
  // intermediate blend. Use the latest frame as the reference for that shot.
  const rightIndex = samples.length - 2;
  const right = samples[rightIndex];
  const after = samples.at(-1);
  if (after.change > threshold * .55) return null;
  let best = null;
  for (let i = rightIndex - 3; i >= 0; i--) {
    const left = samples[i];
    if (left.change > threshold * .55) continue;
    const contrast = difference(left, after);
    if (contrast < threshold * .78) continue;
    const final = blendPosition(right, left, after);
    if (Math.abs(1 - final.amount) > .15 || final.residual > .22) continue;
    const middle = blendPosition(samples[Math.floor((i + rightIndex) / 2)], left, after);
    if (middle.residual > .26) continue;
    let previous = 0;
    let firstMixed;
    let lastMixed;
    let from = left.time;
    let low = left.time;
    let high;
    let residual = 0;
    let valid = true;
    for (let j = i + 1; j < samples.length; j++) {
      const sample = samples[j];
      const { amount, residual: error } = blendPosition(sample, left, after);
      if (error > .28 || amount < previous - .10 || amount - previous > .63) {
        valid = false;
        break;
      }
      residual += error;
      if (amount <= .04 && firstMixed === undefined) from = sample.time;
      if (amount > .08 && amount < .92) {
        firstMixed ??= amount;
        lastMixed = amount;
      }
      if (amount < .99) {
        low = sample.time;
        high = undefined;
      } else {
        high ??= sample.time;
      }
      previous = amount;
    }
    if (!valid || firstMixed === undefined || lastMixed - firstMixed < .20) continue;
    const score = contrast * (1 - residual / (samples.length - i - 1));
    if (!best || score > best.score) best = { from, low, high, left, right: after, score };

}
async function checkShortDissolve(reader, ctx, cut, end, threshold, signal) {

  // A short overlap may have only one mixed frame in the coarse scan.
  for (let time = start; ; time = Math.min(time + .027, stop)) {
    await seek(reader, time, signal);
    const frame = describe(reader, ctx);
    const previous = samples.at(-1);
    samples.push({ ...frame, time, change: previous ? difference(previous, frame) : 0 });
    if (samples.length >= 5 && time >= cut.low) {
      const candidate = findDissolve(samples, threshold);
      if (candidate && candidate.from <= cut.high && candidate.high >= cut.low
        && (!best || candidate.score > best.score + .001)) best = candidate;
    }

}
async function detect(reader, signal) {
  const analysis = document.createElement('canvas');
  analysis.width = 32;
  analysis.height = 18;
  const ctx = analysis.getContext('2d', { willReadFrequently: true });
  const threshold = Number(byId('sensitivity').value);
  const cuts = [capture(reader, 0)];
  const end = Math.max(0, reader.duration - .025);
  const step = .12;
  const samples = [{ ...describe(reader, ctx), time: 0, change: 0 }];
  const hardCuts = [];
  const dissolves = [];
  for (let time = Math.min(step, end); time > samples.at(-1).time; time = Math.min(time + step, end)) {
    await seek(reader, time, signal);
    const frame = describe(reader, ctx);
    const previous = samples.at(-1);
    const change = difference(previous, frame);
    if (change >= threshold) hardCuts.push({ low: previous.time, high: time, left: previous });
    samples.push({ ...frame, time, change });
    if (samples.length > 28) samples.shift();
    if (samples.length >= 5) {
      const dissolve = findDissolve(samples, threshold);
      if (dissolve) {
        const last = dissolves.at(-1);
        if (!last || dissolve.from >= last.high) dissolves.push(dissolve);
        else if (dissolve.score > last.score + .001) dissolves[dissolves.length - 1] = dissolve;
      }
    }
    const percent = time / reader.duration * 80;
    progress('カットを検出中 · ' + Math.floor(percent) + '%', percent);
  }
  const boundaries = [...dissolves];
  let dissolveIndex = 0;
  for (const [index, cut] of hardCuts.entries()) {
    const middle = (cut.low + cut.high) / 2;
    while (dissolves[dissolveIndex]?.high < middle) dissolveIndex++;
    if (!dissolves[dissolveIndex] || middle < dissolves[dissolveIndex].from) {
      const shortDissolve = await checkShortDissolve(reader, ctx, cut, end, threshold, signal);
      boundaries.push(shortDissolve ?? cut);
    }
    progress('切り替わりの位置を確認中', 80 + 10 * (index + 1) / hardCuts.length);
  }
  boundaries.sort((a, b) => a.high - b.high);
  for (const [index, boundary] of boundaries.entries()) {
    let { low, high } = boundary;
    while (high - low > .017) {
      const middle = (low + high) / 2;
      await seek(reader, middle, signal);
      const frame = describe(reader, ctx);
      const switched = boundary.right
        ? blendPosition(frame, boundary.left, boundary.right).amount >= .99
        : difference(boundary.left, frame) >= threshold * .85;
      if (switched) high = middle;
      else low = middle;
    }
    if (high - cuts.at(-1).start >= .06) {
      await seek(reader, Math.min(end, high + .04), signal);
      cuts.push(capture(reader, high));
    }
    progress('カット画像を作成中', 90 + 10 * (index + 1) / boundaries.length);
  }

}
function openFile(file) {
  if (!file || state.task) return;
  if (state.cuts.some(cut => cut.note.trim()) && !confirm('動画を変更すると、現在の音声メモが消えます。変更しますか？')) return;
  run('動画を読み込み中…', async signal => {
    const url = URL.createObjectURL(file);
    try {
      const result = await withReader(url, signal, async reader => ({
        duration: reader.duration,
        cuts: await detect(reader, signal)
      }));
      if (state.url) URL.revokeObjectURL(state.url);
      Object.assign(state, { file, url, ...result });
      video.src = url;
      render();
    } finally {
      if (state.url !== url) URL.revokeObjectURL(url);
    }
  }, 'この動画を読み込めませんでした。ブラウザで再生できる形式（例：H.264 の MP4）を選んでください。');
}
byId('pick').onclick = byId('replace').onclick = () => picker.click();
picker.onchange = () => {
  const file = picker.files[0];
  picker.value = '';
  openFile(file);
};
const fileDrag = event => Array.from(event.dataTransfer.types).includes('Files');
window.addEventListener('dragover', event => { if (fileDrag(event)) event.preventDefault(); });
window.addEventListener('drop', event => { if (fileDrag(event)) event.preventDefault(); });
byId('source').addEventListener('dragover', event => {
  if (!fileDrag(event)) return;
  byId('pick').classList.add('over');
  event.dataTransfer.dropEffect = state.task ? 'none' : 'copy';
});
byId('source').addEventListener('dragleave', event => {
  if (!byId('source').contains(event.relatedTarget)) byId('pick').classList.remove('over');
});
byId('source').addEventListener('drop', event => {
  byId('pick').classList.remove('over');
  openFile(event.dataTransfer.files[0]);
});
byId('scan').onclick = () => {
  if (state.cuts.some(cut => cut.note.trim()) && !confirm('再検出すると、現在の音声メモが消えます。続けますか？')) return;
  run('動画を読み込み中…', async signal => {
    state.cuts = await withReader(state.url, signal, reader => detect(reader, signal));
    render();
  }, '再検出できませんでした。現在のカットは保持されています。');
};
byId('add').onclick = () => {
  video.pause();
  const start = video.currentTime;
  if (start >= state.duration - .025 || state.cuts.some(cut => Math.abs(cut.start - start) < .04)) {
    error('既存の境目や動画の末尾から少し離れた位置で追加してください。');
    return;
  }
  run('キャプチャー中…', async signal => {
    const cut = await withReader(state.url, signal, async reader => {
      await seek(reader, start, signal);
      return capture(reader, start);
    });
    const index = state.cuts.findIndex(item => item.start > start);
    const insertion = index === -1 ? state.cuts.length : index;
    state.cuts.splice(insertion, 0, cut);
    render();
    list.children[insertion]?.querySelector('textarea').focus();
  }, 'この位置の画像を取得できませんでした。');
};
function wrapText(ctx, text, width) {
  const lines = [];
  const segmenter = new Intl.Segmenter('ja', { granularity: 'grapheme' });
  for (const paragraph of text.replaceAll('\t', '    ').split(/\r?\n/)) {
    let line = '';
    for (const { segment } of segmenter.segment(paragraph)) {
      if (line && ctx.measureText(line + segment).width > width) {
        lines.push(line);
        line = '';
      }
      line += segment;
    }
    lines.push(line);
  }
  return lines;
}
function encodePdf(pages, pixelWidth, pixelHeight) {
  const bytes = [];
  const offsets = [0];
  const encoder = new TextEncoder();
  let length = 0;
  function append(chunk) {
    const data = typeof chunk === 'string' ? encoder.encode(chunk) : chunk;
    bytes.push(data);
    length += data.byteLength;
  }
  function object(id, ...chunks) {
    offsets[id] = length;
    append(id + ' 0 obj\n');
    for (const chunk of chunks) append(chunk);
    append('\nendobj\n');
  }
  const width = '595.276';
  const height = '841.890';
  append('%PDF-1.4\n');
  append(new Uint8Array([37, 226, 227, 207, 211, 10]));
  object(1, '<< /Type /Catalog /Pages 2 0 R >>');
  object(2, '<< /Type /Pages /Count ' + pages.length + ' /Kids [' +
    pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>');
  for (const [i, jpeg] of pages.entries()) {
    const page = 3 + i * 3;
    const paint = 'q\n' + width + ' 0 0 ' + height + ' 0 0 cm\n/Sheet Do\nQ\n';
    object(page, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + width + ' ' + height +
      '] /Resources << /XObject << /Sheet ' + (page + 1) + ' 0 R >> >> /Contents ' + (page + 2) + ' 0 R >>');
    object(page + 1, '<< /Type /XObject /Subtype /Image /ColorSpace /DeviceRGB /BitsPerComponent 8' +
      ' /Filter /DCTDecode /Width ' + pixelWidth + ' /Height ' + pixelHeight + ' /Length ' +
      jpeg.byteLength + ' >>\nstream\n', jpeg, '\nendstream');
    object(page + 2, '<< /Length ' + paint.length + ' >>\nstream\n', paint, 'endstream');
  }
  const xref = length;
  append('xref\n0 ' + offsets.length + '\n0000000000 65535 f \n');
  for (const offset of offsets.slice(1)) append(String(offset).padStart(10, '0') + ' 00000 n \n');
  append('trailer\n<< /Size ' + offsets.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

function jpegBytes(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(async blob => {
      if (!blob) { reject(new Error('Page encoding failed')); return; }
      try { resolve(new Uint8Array(await blob.arrayBuffer())); } catch (err) { reject(err); }
    }, 'image/jpeg', .94);
  });
}
async function makePdf() {
  const canvas = document.createElement('canvas');
  const width = 794, height = 1123, left = 39, right = 755, bottom = 1057;
  const numberX = left + 10, imageX = 99, timeX = 278, audioX = 390;
  const imageWidth = 161, imageHeight = 86, lineHeight = 21, baseRow = 100;
  canvas.width = width * 2;
  canvas.height = height * 2;
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.scale(2, 2);
  const font = getComputedStyle(document.body).getPropertyValue('--sans');
  const colors = { ink: '#19241e', muted: '#53635a', green: '#175641', line: '#cad6cd' };
  function setFont(size, weight = 400) { ctx.font = weight + ' ' + size + 'px ' + font; }
  function write(value, x, y, size, color = colors.ink, weight = 400) {
    setFont(size, weight);
    ctx.fillStyle = color;
    ctx.fillText(value, x, y);
  }
  function rule(y) {
    ctx.fillStyle = colors.line;
    ctx.fillRect(left, y, right - left, 1);
  }
  setFont(26, 700);
  const title = wrapText(ctx, byId('sheet-title').value.trim() || state.file.name, right - left);
  const header = 83 + title.length * 32;
  const firstRow = header + 34;
  const plan = [[]];
  let y = firstRow;
  for (const [index, cut] of state.cuts.entries()) {
    setFont(15);
    const lines = wrapText(ctx, cut.note, right - audioX - 10);
    const start = cut.start;
    const end = state.cuts[index + 1]?.start ?? state.duration;
    let offset = 0;
    while (offset < lines.length) {
      const rowHeight = Math.max(baseRow, lines.length * lineHeight + 22);
      if (offset === 0 && y !== firstRow && y + rowHeight > bottom) {
        plan.push([]);
        y = firstRow;
      }
      const take = Math.min(lines.length - offset, Math.floor((bottom - y - 22) / lineHeight));
      if (take < 1) throw new Error('Page header leaves no room for notes');
      const row = Math.max(offset ? 62 : baseRow, take * lineHeight + 22);
      plan.at(-1).push({ cut, index, start, end, lines: lines.slice(offset, offset + take), y, row, continued: offset > 0 });
      offset += take;
      y += row;
      if (offset < lines.length) { plan.push([]); y = firstRow; }
    }
  }
  const pages = [];
  for (const [index, rows] of plan.entries()) {
    progress('PDFを作成中 · ' + (index + 1) + ' / ' + plan.length, 100 * index / plan.length);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);
    title.forEach((line, i) => write(line, left, 54 + i * 32, 26, colors.ink, 700));
    write('カットシート  /  ' + state.cuts.length + ' カット  /  全体 ' + clock(state.duration), left, header - 14, 13, colors.green, 700);
    ctx.fillStyle = '#eaf1ea';
    ctx.fillRect(left, header, right - left, 34);
    write('No.', numberX, header + 22, 13, colors.ink, 700);
    write('キャプチャー', imageX, header + 22, 13, colors.ink, 700);
    write('秒数・開始', timeX, header + 22, 13, colors.ink, 700);
    write('音声メモ', audioX, header + 22, 13, colors.ink, 700);
    for (const entry of rows) {
      const { cut, start, end, continued, y, row } = entry;
      write(cutNo(entry.index), numberX, y + 26, 13, colors.green, 700);
      if (!continued) {
        const img = new Image();
        img.src = cut.image;
        await img.decode();
        const scale = Math.min(imageWidth / img.width, imageHeight / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.fillStyle = '#18251e';
        ctx.fillRect(imageX, y + 7, imageWidth, imageHeight);
        ctx.drawImage(img, imageX + (imageWidth - w) / 2, y + 7 + (imageHeight - h) / 2, w, h);
        write(seconds(end - start), timeX, y + 26, 16, colors.ink, 700);
        write(clock(start), timeX, y + 46, 13, colors.muted);
      } else {
        write('続き', imageX, y + 26, 13, colors.green, 700);
      }
      entry.lines.forEach((line, i) => write(line, audioX, y + 25 + i * lineHeight, 15));
      rule(y + row);
    }
    rule(1072);
    write('CUT SHEET   /   A4', left, 1092, 11, colors.muted, 700);
    ctx.textAlign = 'right';
    write((index + 1) + ' / ' + plan.length, right, 1092, 12, colors.muted, 700);
    ctx.textAlign = 'left';
    pages.push(await jpegBytes(canvas));
  }
  return encodePdf(pages, canvas.width, canvas.height);
}
byId('pdf').onclick = () => run('PDFを作成中…', async () => {
  const url = URL.createObjectURL(await makePdf());
  const link = document.createElement('a');
  link.href = url;
  link.download = state.file.name.replace(/\.[^.]+$/, '') + '_カットシート.pdf';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}, 'PDFの作成に失敗しました。もう一度お試しください。', false);
refresh();
